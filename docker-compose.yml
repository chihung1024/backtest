services:
  api:
    build:
      context: ./backend
    environment:
      BACKTEST_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8080"

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - api
