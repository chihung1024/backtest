name: Release verified version

on:
  workflow_run:
    workflows: ["Continuous integration"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verified-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release verified version
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^__version__ = "\([^\"]*\)"/\1/p' backend/app/__init__.py)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid or missing version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create fixed tag and GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to change."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "Portfolio Backtest Lab $TAG" \
            --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Release summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CREATED: ${{ steps.release.outputs.created }}
        run: |
          echo "Release: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Created: $CREATED" >> "$GITHUB_STEP_SUMMARY"
