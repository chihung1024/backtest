name: Live corporate action validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/universal-corporate-action-reconciliation

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Validate known market-scale transitions through generic resolver
        working-directory: backend
        run: |
          python - <<'PY'
          from datetime import date

          from app.data.yfinance_provider import YFinanceProvider

          cases = [
              ("0050.TW", date(2025, 6, 1), date(2025, 6, 30), date(2025, 6, 18)),
              ("0052.TW", date(2025, 11, 1), date(2025, 12, 5), date(2025, 11, 26)),
              ("00631L.TW", date(2026, 3, 1), date(2026, 4, 10), date(2026, 3, 31)),
          ]

          provider = YFinanceProvider(ttl_seconds=1)
          for symbol, start, end, resumption in cases:
              history = provider._download_local([symbol], start, end)[symbol]
              series = history.total_returns
              print(f"\n{symbol}")
              print(series.loc[resumption.strftime('%Y-%m-%d')].to_string())
              resume_return = float(series.loc[resumption.strftime('%Y-%m-%d')].iloc[0])
              print(
                  {
                      "resume_return": resume_return,
                      "split_events": history.split_events,
                      "split_corrections": history.split_corrections,
                      "repaired_observations": history.repaired_observations,
                  }
              )
              assert -0.35 < resume_return < 0.35
              assert history.split_events >= 1
          PY
