name: Configure billing budget alerts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/billing-budget.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: billing-budget-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: backtest-465701
  GCP_PROJECT_NUMBER: "454423251671"
  GCP_WIF_PROVIDER: projects/454423251671/locations/global/workloadIdentityPools/github/providers/backtest
  GCP_DEPLOY_SERVICE_ACCOUNT: backtest-deployer@backtest-465701.iam.gserviceaccount.com
  BILLING_ACCOUNT_SUFFIX: 3BA9

jobs:
  configure:
    name: Set TWD 150 budget thresholds
    runs-on: ubuntu-latest
    environment: production-api
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Google Cloud without a service-account key
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Apply and verify 5%, 20%, and 50% actual-spend alerts
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          billing_accounts_file="$RUNNER_TEMP/billing-accounts.json"
          budgets="$RUNNER_TEMP/budgets.json"
          request="$RUNNER_TEMP/budget-update-request.json"
          response="$RUNNER_TEMP/budget-update-response.json"

          status="$(curl --silent --show-error \
            --output "$billing_accounts_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://cloudbilling.googleapis.com/v1/billingAccounts?pageSize=100")"
          if [[ "$status" != "200" ]]; then
            echo "Unable to list accessible billing accounts (HTTP $status)." >&2
            echo "Verify Billing Account Costs Manager is granted to the deploy service account." >&2
            exit 1
          fi

          mapfile -t billing_accounts < <(jq -r \
            --arg suffix "$BILLING_ACCOUNT_SUFFIX" '
              .billingAccounts[]?
              | select(.open == true)
              | select(.name | endswith($suffix))
              | .name
            ' "$billing_accounts_file")

          if [[ "${#billing_accounts[@]}" -ne 1 ]]; then
            echo "Expected exactly one accessible open billing account with the approved suffix; found ${#billing_accounts[@]}." >&2
            exit 1
          fi
          billing_account="${billing_accounts[0]}"

          status="$(curl --silent --show-error \
            --output "$budgets" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://billingbudgets.googleapis.com/v1/$billing_account/budgets?pageSize=1000")"
          if [[ "$status" != "200" ]]; then
            echo "Unable to list billing budgets (HTTP $status)." >&2
            exit 1
          fi

          mapfile -t budget_names < <(jq -r \
            --arg project_id "$GCP_PROJECT_ID" \
            --arg project_number "$GCP_PROJECT_NUMBER" '
              .budgets[]?
              | select(.amount.specifiedAmount.currencyCode == "TWD")
              | select((.amount.specifiedAmount.units | tonumber) == 150)
              | select((.amount.specifiedAmount.nanos // 0) == 0)
              | select(.budgetFilter.calendarPeriod == "MONTH")
              | select(
                  ((.budgetFilter.projects // []) | length) == 0
                  or ((.budgetFilter.projects // []) | index("projects/" + $project_id)) != null
                  or ((.budgetFilter.projects // []) | index("projects/" + $project_number)) != null
                )
              | .name
            ' "$budgets")

          if [[ "${#budget_names[@]}" -ne 1 ]]; then
            echo "Expected exactly one matching monthly TWD 150 budget; found ${#budget_names[@]}." >&2
            exit 1
          fi

          budget_name="${budget_names[0]}"
          jq -n --arg name "$budget_name" '{
            name: $name,
            thresholdRules: [
              {thresholdPercent: 0.05, spendBasis: "CURRENT_SPEND"},
              {thresholdPercent: 0.20, spendBasis: "CURRENT_SPEND"},
              {thresholdPercent: 0.50, spendBasis: "CURRENT_SPEND"}
            ]
          }' > "$request"

          status="$(curl --silent --show-error \
            --request PATCH \
            --output "$response" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$request" \
            "https://billingbudgets.googleapis.com/v1/$budget_name?updateMask=thresholdRules")"
          if [[ "$status" != "200" ]]; then
            echo "Unable to update billing budget thresholds (HTTP $status)." >&2
            exit 1
          fi

          if ! jq -e '
            (.thresholdRules | length) == 3
            and ([.thresholdRules[] | select(.spendBasis == "CURRENT_SPEND")
                  | (.thresholdPercent * 100 | round)] | sort) == [5, 20, 50]
          ' "$response" >/dev/null; then
            echo "The Billing Budget API response did not contain the requested thresholds." >&2
            exit 1
          fi

          echo "Monthly TWD 150 actual-spend alerts: 5%, 20%, 50%." >> "$GITHUB_STEP_SUMMARY"
