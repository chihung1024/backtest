name: Apply FX OHLC reconciliation

on:
  push:
    branches: [fix/fx-ohlc-reconciliation]
    paths:
      - "scripts/apply_fx_ohlc_patch.py"
      - ".github/workflows/apply-fx-ohlc-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/fx-ohlc-reconciliation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/apply_fx_ohlc_patch.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app backend/pyproject.toml frontend/package.json frontend/package-lock.json docs/METHODOLOGY.md
          git commit -m "fix: validate and reconcile FX OHLC levels"
          git push origin HEAD:fix/fx-ohlc-reconciliation
