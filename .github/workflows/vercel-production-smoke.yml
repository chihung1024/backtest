name: Vercel retirement acceptance

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/vercel-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-retirement-acceptance
  cancel-in-progress: true

jobs:
  verify:
    name: Vercel Production · retired API acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://portfolio-backtest-api.vercel.app
      REPLACEMENT_URL: https://backteststock.chired.workers.dev/portfolio/
    steps:
      - uses: actions/checkout@v7
      - name: Wait for exact retired Vercel revision
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          replacement = os.environ["REPLACEMENT_URL"]
          expected_commit = os.environ["GITHUB_SHA"]

          def request(path: str, *, method: str = "GET", payload=None):
              headers = {"User-Agent": "backtest-vercel-retirement-acceptance/1.0"}
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{base}{path}", data=data, headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(req, timeout=180) as response:
                      return response.status, response.headers, response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.headers, exc.read().decode("utf-8")

          last_error = "retired production deployment did not become ready"
          for _attempt in range(60):
              try:
                  status, headers, body = request("/health")
                  payload = json.loads(body)
                  if (
                      status == 410
                      and payload.get("status") == "retired"
                      and payload.get("code") == "legacy_project_retired"
                      and payload.get("replacement_url") == replacement
                      and payload.get("deployment_sha") == expected_commit
                      and headers.get("Location") == replacement
                  ):
                      break
                  last_error = (
                      f"waiting for retired deployment {expected_commit}; "
                      f"status={status}; current={payload.get('deployment_sha')!r}; "
                      f"code={payload.get('code')!r}"
                  )
              except Exception as exc:  # noqa: BLE001
                  last_error = repr(exc)
              time.sleep(10)
          else:
              raise SystemExit(last_error)

          checks = [
              ("GET", "/", None),
              ("GET", "/health", None),
              ("GET", "/api/v1/auth/check", None),
              ("GET", "/api/v1/assets/search?q=VT&limit=5", None),
              ("POST", "/api/v1/backtests", {}),
          ]
          for method, path, payload in checks:
              status, headers, body = request(path, method=method, payload=payload)
              result = json.loads(body)
              assert status == 410, (path, status, body)
              assert result.get("status") == "retired", (path, result)
              assert result.get("code") == "legacy_project_retired", (path, result)
              assert result.get("replacement_url") == replacement, (path, result)
              assert result.get("deployment_sha") == expected_commit, (path, result)
              assert headers.get("Location") == replacement, (path, headers)
              assert headers.get("Cache-Control") == "no-store", (path, headers)

          print("Vercel retirement acceptance passed", expected_commit)
          PY
