name: Vercel production acceptance

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/vercel-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-acceptance
  cancel-in-progress: true

jobs:
  verify:
    name: Vercel Production · real API acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://portfolio-backtest-api.vercel.app
      ALLOWED_ORIGIN: https://chihung1024.github.io
    steps:
      - uses: actions/checkout@v7
      - name: Wait for exact Vercel revision and verify real API
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          origin = os.environ["ALLOWED_ORIGIN"]
          expected_commit = os.environ["GITHUB_SHA"]

          def request(path: str, *, method: str = "GET", payload=None, allowed_origin=False):
              headers = {"User-Agent": "backtest-vercel-production-acceptance/1.0"}
              if allowed_origin:
                  headers["Origin"] = origin
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{base}{path}", data=data, headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(req, timeout=180) as response:
                      return response.status, response.headers, response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.headers, exc.read().decode("utf-8")

          last_error = "production deployment did not become ready"
          for attempt in range(60):
              try:
                  status, _, body = request("/health")
                  if status == 200:
                      health = json.loads(body)
                      if (
                          health.get("status") == "ok"
                          and health.get("deployment_sha") == expected_commit
                      ):
                          break
                      last_error = (
                          "waiting for deployment "
                          f"{expected_commit}; current={health.get('deployment_sha')!r}"
                      )
                  else:
                      last_error = f"health returned {status}: {body[:300]}"
              except Exception as exc:  # noqa: BLE001
                  last_error = repr(exc)
              time.sleep(10)
          else:
              raise SystemExit(last_error)

          status, headers, body = request("/api/v1/auth/check")
          assert status == 403, (status, body)
          assert json.loads(body)["detail"] == "Browser origin is not allowed"
          assert headers.get("Cache-Control") == "no-store"

          status, headers, body = request(
              "/api/v1/auth/check", allowed_origin=True
          )
          assert status == 200, (status, body)
          assert json.loads(body)["status"] == "ok"
          assert headers.get("Access-Control-Allow-Origin") == origin

          status, _, body = request(
              "/api/v1/assets/search?q=VT&limit=5", allowed_origin=True
          )
          assert status == 200, (status, body)
          search = json.loads(body)
          assert isinstance(search, list) and search, search
          assert any(item.get("symbol") == "VT" for item in search), search

          payload = {
              "portfolios": [
                  {
                      "name": "Global",
                      "assets": [{"symbol": "VT", "weight": 100}],
                  }
              ],
              "benchmark": "VT",
              "start_date": "2024-01-01",
              "end_date": "2024-06-30",
              "base_currency": "TWD",
          }
          last = None
          for attempt in range(3):
              status, _, body = request(
                  "/api/v1/backtests",
                  method="POST",
                  payload=payload,
                  allowed_origin=True,
              )
              last = (status, body)
              if status == 200:
                  result = json.loads(body)
                  assert result["base_currency"] == "TWD"
                  assert result["results"][0]["name"] == "Global"
                  assert result["results"][0]["series"], result
                  break
              time.sleep(20)
          else:
              raise AssertionError(last)

          print("Vercel production acceptance passed", expected_commit)
          PY
