name: Vercel preview smoke

on:
  push:
    branches: [migrate/gcp-to-vercel-hobby]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-preview-smoke
  cancel-in-progress: true

jobs:
  verify:
    name: Vercel Preview · real API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://portfolio-backtest-api-git-migrate-gcp-404d5b-cchungs-projects.vercel.app
      ALLOWED_ORIGIN: https://chihung1024.github.io
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the matching Vercel preview and verify API behavior
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          origin = os.environ["ALLOWED_ORIGIN"]

          def request(path: str, *, method: str = "GET", payload=None, allowed_origin=False):
              headers = {"User-Agent": "backtest-vercel-smoke/1.0"}
              if allowed_origin:
                  headers["Origin"] = origin
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{base}{path}", data=data, headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(req, timeout=150) as response:
                      return response.status, response.headers, response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.headers, exc.read().decode("utf-8")

          expected_commit = os.environ.get("GITHUB_SHA", "")
          last_error = "preview did not become ready"
          for attempt in range(24):
              try:
                  status, _, body = request("/health")
                  if status == 200:
                      health = json.loads(body)
                      if health.get("status") == "ok":
                          break
                  last_error = f"health returned {status}: {body[:300]}"
              except Exception as exc:  # noqa: BLE001
                  last_error = repr(exc)
              time.sleep(10)
          else:
              raise SystemExit(last_error)

          status, headers, body = request("/api/v1/auth/check")
          assert status == 403, (status, body)
          assert json.loads(body)["detail"] == "Browser origin is not allowed"
          assert headers.get("Cache-Control") == "no-store"

          status, headers, body = request(
              "/api/v1/auth/check", allowed_origin=True
          )
          assert status == 200, (status, body)
          assert json.loads(body)["status"] == "ok"
          assert headers.get("Access-Control-Allow-Origin") == origin

          status, _, body = request(
              "/api/v1/assets/search?q=VT&limit=5", allowed_origin=True
          )
          assert status == 200, (status, body)
          search = json.loads(body)
          assert isinstance(search, list) and search, search
          assert any(item.get("symbol") == "VT" for item in search), search

          payload = {
              "portfolios": [
                  {
                      "name": "Global",
                      "assets": [{"symbol": "VT", "weight": 100}],
                  }
              ],
              "benchmark": "VT",
              "start_date": "2024-01-01",
              "end_date": "2024-06-30",
              "base_currency": "TWD",
          }
          last = None
          for attempt in range(3):
              status, _, body = request(
                  "/api/v1/backtests",
                  method="POST",
                  payload=payload,
                  allowed_origin=True,
              )
              last = (status, body)
              if status == 200:
                  result = json.loads(body)
                  assert result["base_currency"] == "TWD"
                  assert result["results"][0]["name"] == "Global"
                  assert result["results"][0]["series"], result
                  break
              time.sleep(15)
          else:
              raise AssertionError(last)

          print("Vercel preview smoke passed", expected_commit)
          PY
