name: Apply universal corporate action reconciliation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-universal-corporate-action-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/universal-corporate-action-reconciliation
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Apply deterministic source patch
        run: python tools/apply_universal_corporate_action_fix.py

      - name: Preserve ordinary service warnings in audit test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_service.py")
          content = path.read_text(encoding="utf-8")
          old = "    assert response.warnings == []\n"
          new = (
              '    assert not any("yfinance repaired" in warning for warning in response.warnings)\n'
              '    assert not any("split transition" in warning for warning in response.warnings)\n'
          )
          if content.count(old) != 1:
              raise RuntimeError("Expected exactly one generated warning assertion")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Format generated backend code
        working-directory: backend
        run: ruff check --fix app tests

      - name: Backend lint
        working-directory: backend
        run: ruff check app tests

      - name: Backend tests
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Commit validated implementation
        run: |
          rm .github/workflows/apply-universal-corporate-action-fix.yml
          rm tools/apply_universal_corporate_action_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: reconcile omitted corporate actions generically"
          git push origin HEAD:agent/universal-corporate-action-reconciliation
