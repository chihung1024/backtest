name: Diagnose transient price scales

on:
  push:
    branches: [fix/transient-price-scale-pulses]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e .
      - name: Inspect isolated Yahoo price pulses
        working-directory: backend
        run: |
          python - <<'PY'
          import math
          import pandas as pd
          import yfinance as yf

          symbol = "USD"
          raw = yf.download(
              symbol,
              start="2007-01-01",
              end="2026-07-31",
              auto_adjust=False,
              actions=True,
              repair=True,
              keepna=True,
              progress=False,
              threads=False,
              timeout=30,
          )
          if isinstance(raw.columns, pd.MultiIndex):
              if symbol in raw.columns.get_level_values(0):
                  raw = raw[symbol]
              elif symbol in raw.columns.get_level_values(1):
                  raw = raw.xs(symbol, axis=1, level=1)
          raw.index = pd.to_datetime(raw.index).tz_localize(None)
          close = pd.to_numeric(raw["Close"], errors="coerce")
          gross = close / close.shift(1)
          next_gross = gross.shift(-1)
          bridge = close.shift(-1) / close.shift(1)
          log_gross = gross.map(
              lambda value: abs(math.log(value))
              if pd.notna(value) and value > 0
              else 0.0
          )
          log_next = next_gross.map(
              lambda value: abs(math.log(value))
              if pd.notna(value) and value > 0
              else 0.0
          )
          log_bridge = bridge.map(
              lambda value: abs(math.log(value))
              if pd.notna(value) and value > 0
              else 999.0
          )
          pulse = (
              (gross > 0)
              & (next_gross > 0)
              & (log_gross > math.log(3))
              & (log_next > math.log(3))
              & (log_bridge < math.log(1.5))
          )
          candidates = raw.loc[pulse].index
          print(f"rows={len(raw)} candidates={len(candidates)}")
          requested = [
              "Open", "High", "Low", "Close", "Adj Close", "Volume",
              "Dividends", "Stock Splits", "Capital Gains", "Repaired?",
          ]
          columns = [column for column in requested if column in raw.columns]
          for timestamp in candidates:
              position = raw.index.get_loc(timestamp)
              start = max(0, position - 3)
              end = min(len(raw), position + 4)
              print("\nCANDIDATE", timestamp.date())
              print(raw.iloc[start:end][columns].to_string())
              print(
                  "gross", gross.iloc[position],
                  "next_gross", next_gross.iloc[position],
                  "bridge", bridge.iloc[position],
              )
          PY
