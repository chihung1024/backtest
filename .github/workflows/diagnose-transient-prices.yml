name: Diagnose transient price scales

on:
  push:
    branches: [fix/transient-price-scale-pulses]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e .
      - name: Inspect asset and FX discontinuities
        working-directory: backend
        run: |
          python - <<'PY'
          from datetime import date

          import pandas as pd
          import yfinance as yf

          from app.data.yfinance_provider import YFinanceProvider, _history_from_frame

          def frame_for(symbol: str, *, auto_adjust: bool, actions: bool) -> pd.DataFrame:
              raw = yf.download(
                  symbol,
                  start="2007-01-01",
                  end="2026-07-31",
                  auto_adjust=auto_adjust,
                  actions=actions,
                  repair=True,
                  keepna=True,
                  progress=False,
                  threads=False,
                  timeout=30,
              )
              if isinstance(raw.columns, pd.MultiIndex):
                  if symbol in raw.columns.get_level_values(0):
                      raw = raw[symbol]
                  elif symbol in raw.columns.get_level_values(1):
                      raw = raw.xs(symbol, axis=1, level=1)
              raw.index = pd.to_datetime(raw.index).tz_localize(None)
              return raw

          def show_levels(label: str, raw: pd.DataFrame) -> None:
              close = pd.to_numeric(raw["Close"], errors="coerce")
              gross = close / close.shift(1)
              mask = (gross < 0.60) | (gross > 1.80)
              print(f"\n{label}: rows={len(raw)} discontinuities={int(mask.sum())}")
              columns = [
                  column for column in [
                      "Open", "High", "Low", "Close", "Adj Close", "Volume",
                      "Dividends", "Stock Splits", "Capital Gains", "Repaired?",
                  ] if column in raw.columns
              ]
              for timestamp in raw.index[mask.fillna(False)]:
                  position = raw.index.get_loc(timestamp)
                  start = max(0, position - 2)
                  end = min(len(raw), position + 4)
                  print("\nCANDIDATE", timestamp.date(), "gross", gross.iloc[position])
                  print(raw.iloc[start:end][columns].to_string())

          asset = frame_for("USD", auto_adjust=False, actions=True)
          show_levels("ASSET USD", asset)
          history = _history_from_frame(
              "USD", asset, date(2007, 1, 1), date(2026, 7, 30), currency="USD"
          )
          if history is None:
              raise RuntimeError("normalization returned no asset history")
          large = (history.total_returns < -0.40) | (history.total_returns > 0.80)
          print("ASSET NORMALIZED LARGE", history.total_returns.loc[large].to_string())

          for ticker in ("TWD=X", "USDTWD=X", "TWDUSD=X"):
              raw = frame_for(ticker, auto_adjust=True, actions=False)
              show_levels(f"FX {ticker}", raw)

          provider = YFinanceProvider()
          fx = provider._download_fx_levels(
              "USD", "TWD", date(2007, 1, 1), date(2026, 7, 30)
          )
          fx_gross = fx / fx.shift(1)
          fx_large = (fx_gross < 0.60) | (fx_gross > 1.80)
          print("\nSELECTED FX LARGE")
          print(pd.DataFrame({"level": fx, "gross": fx_gross}).loc[fx_large].to_string())
          PY
