name: Diagnose transient price scales

on:
  push:
    branches: [fix/transient-price-scale-pulses]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e .
      - name: Inspect Yahoo discontinuities and normalized returns
        working-directory: backend
        run: |
          python - <<'PY'
          from datetime import date

          import pandas as pd
          import yfinance as yf

          from app.data.yfinance_provider import _history_from_frame

          symbol = "USD"
          raw = yf.download(
              symbol,
              start="2007-01-01",
              end="2026-07-31",
              auto_adjust=False,
              actions=True,
              repair=True,
              keepna=True,
              progress=False,
              threads=False,
              timeout=30,
          )
          if isinstance(raw.columns, pd.MultiIndex):
              if symbol in raw.columns.get_level_values(0):
                  raw = raw[symbol]
              elif symbol in raw.columns.get_level_values(1):
                  raw = raw.xs(symbol, axis=1, level=1)
          raw.index = pd.to_datetime(raw.index).tz_localize(None)
          close = pd.to_numeric(raw["Close"], errors="coerce")
          adjusted = pd.to_numeric(raw.get("Adj Close", raw["Close"]), errors="coerce")
          close_gross = close / close.shift(1)
          adjusted_gross = adjusted / adjusted.shift(1)
          history = _history_from_frame(
              symbol,
              raw,
              date(2007, 1, 1),
              date(2026, 7, 30),
              currency="USD",
          )
          if history is None:
              raise RuntimeError("normalization returned no history")

          raw_mask = (
              (close_gross < 0.60)
              | (close_gross > 1.80)
              | (adjusted_gross < 0.60)
              | (adjusted_gross > 1.80)
          )
          normalized_mask = (
              (history.total_returns < -0.40)
              | (history.total_returns > 0.80)
              | (history.price_returns < -0.40)
              | (history.price_returns > 0.80)
              | (history.dividend_returns > 0.40)
          )
          candidates = raw.index[raw_mask.fillna(False)].union(
              history.total_returns.index[normalized_mask.fillna(False)]
          )
          print(
              f"rows={len(raw)} candidates={len(candidates)} "
              f"split_events={history.split_events} "
              f"corrections={history.split_corrections}"
          )
          requested = [
              "Open", "High", "Low", "Close", "Adj Close", "Volume",
              "Dividends", "Stock Splits", "Capital Gains", "Repaired?",
          ]
          columns = [column for column in requested if column in raw.columns]
          for timestamp in candidates:
              position = raw.index.get_indexer([timestamp], method="nearest")[0]
              start = max(0, position - 3)
              end = min(len(raw), position + 5)
              print("\nCANDIDATE", timestamp.date())
              print(raw.iloc[start:end][columns].to_string())
              print(
                  "raw_close_gross", close_gross.get(timestamp),
                  "raw_adjusted_gross", adjusted_gross.get(timestamp),
                  "normalized_total", history.total_returns.get(timestamp),
                  "normalized_price", history.price_returns.get(timestamp),
                  "normalized_distribution", history.dividend_returns.get(timestamp),
              )
          PY
