name: Deploy API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/cloud-run.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production API
    if: >-
      ${{ vars.GCP_PROJECT_ID != '' &&
          vars.GCP_WIF_PROVIDER != '' &&
          vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' &&
          vars.GCP_RUNTIME_SERVICE_ACCOUNT != '' &&
          vars.GCP_API_KEY_SECRET != '' &&
          vars.GCP_FRED_API_KEY_SECRET != '' }}
    runs-on: ubuntu-latest
    environment: production-api
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy from Dockerfile
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'portfolio-backtest-api' }}
          region: ${{ vars.GCP_REGION || 'asia-east1' }}
          source: backend
          timeout: 5m
          env_vars: |-
            BACKTEST_ENVIRONMENT=production
            BACKTEST_CORS_ORIGINS=https://chihung1024.github.io
            BACKTEST_CACHE_TTL_SECONDS=21600
          secrets: |-
            BACKTEST_API_KEY=${{ vars.GCP_API_KEY_SECRET }}:latest
            BACKTEST_FRED_API_KEY=${{ vars.GCP_FRED_API_KEY_SECRET }}:latest
          flags: >-
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --cpu=1
            --memory=512Mi
            --concurrency=4
            --min-instances=0
            --max-instances=2
            --port=8080
            --no-cpu-boost
      - name: Verify deployed health endpoint
        run: curl --fail --retry 6 --retry-delay 5 "${{ steps.deploy.outputs.url }}/health"
      - name: Deployment summary
        run: echo "API URL=${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
